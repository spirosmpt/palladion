[project]
name = "palladion"
version = "0.1.0"
description = "AI agents for wildfire evacuation and rescue coordination: replay of the Mati fire, 23 July 2018"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "shapely>=2.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "google-auth>=2.29",                # Vertex AI sign-in (ADC); not needed with an API key
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10", "types-PyYAML", "pyshp>=2.3"]
pipeline = ["requests>=2.31", "pyshp>=2.3", "pillow>=10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["palladion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
