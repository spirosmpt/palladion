  - { id: m31, time: "18:42", channel: "166_call", text: "Στη Ναρκίσσου στο Βουτζά, ένας άντρας με εγκαύματα στα χέρια, τον έχουμε μέσα στο αυτοκίνητο" }
  - { id: m32, time: "18:45", channel: "sms", text: "Δεν βρίσκουμε τον γιο μας, 16 χρονών, ήταν στην παραλία στο Μάτι, φοράει κόκκινο μπλουζάκι" }
  - { id: m33, time: "18:48", channel: "199_call", text: "Ροδοδάφνης, Νέος Βουτζάς προς Ραφήνα, βλέπουμε φλόγες στο τέλος του δρόμου" }
