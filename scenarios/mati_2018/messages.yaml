  - { id: m38, time: "19:10", channel: "199_call", text: "Είμαι στη Δάσους στην Αγία Μαρίνα, η φωτιά είναι πολύ μακριά, απλώς ρωτάω αν πρέπει να φύγουμε" }
  - { id: m39, time: "19:15", channel: "sms", text: "to spiti mas stin ilidos kaike, eimaste stin paralia oloi kala, 4 atoma" }
