# Synthetic citizen messages for the Mati 2018 replay.
#
# Written for this project: no real person's words, names or phone numbers. Street and place names
# are real (OpenStreetMap) so the location agent can be tested on them. Times are scenario time.
# The pipeline reads only this file. Expected answers live in eval/dev/mati_2018_gold.yaml and are
# never read by the agents.

scenario: mati_2018
synthetic: true
messages:
  - { id: m01, time: "17:41", channel: "199_call", text: "Καίγεται το δάσος πάνω από την Καλλιτεχνούπολη, βλέπω τις φλόγες να κατεβαίνουν προς τον Βουτζά. Είμαι στη Ρήγα Φεραίου, ψηλά." }
  - { id: m02, time: "17:45", channel: "166_call", text: "Στη Χρυσοστόμου Σμύρνης στον Βουτζά, ο πατέρας μου έχει άσθμα και δεν μπορεί να αναπνεύσει από τον καπνό. Είμαστε δύο." }
  - { id: m03, time: "17:48", channel: "sms", text: "eimaste sti kolokotroni sto neo voutza, o dromos gemise kapno, mporoume na fygoume pros ta katw?" }
  - { id: m04, time: "17:52", channel: "199_call", text: "Είμαστε στο σπίτι στην Ταϋγέτου στο Νέο Βουτζά, βλέπουμε φλόγες πάνω από τα πεύκα πίσω μας. Είμαστε τρεις, η μητέρα μου δεν περπατάει." }
  - { id: m05, time: "17:55", channel: "messenger", text: "My grandparents live on Afroditis street in Neos Voutzas, they are over 80 and have no car. Please someone help them!" }
  - { id: m06, time: "17:58", channel: "sms", text: "kaigete to dasos piso apo to spiti mas sto mati, odos kyanis aktis. 2 megaloi kai ena paidi ti na kanoume" }
  - { id: m07, time: "18:00", channel: "199_call", text: "Στην Εσπερίδων, ο δρόμος τελειώνει στο δάσος, δεν έχουμε από πού να βγούμε!" }
  - { id: m08, time: "18:01", channel: "sms", text: "Είμαστε καλά, φύγαμε από το σπίτι στην Κυκλαμίνων και είμαστε στη Ραφήνα. Μην στέλνετε κανέναν." }
  - { id: m09, time: "18:03", channel: "facebook", text: "Παιδιά, η μάνα μου είναι στο εξοχικό στο Κόκκινο Λιμανάκι και δεν σηκώνει τηλέφωνο!! Κάποιος κοντά;;" }
  - { id: m10, time: "18:04", channel: "twitter", text: "Βλέπω καπνό από το μπαλκόνι μου στην Αθήνα, πολύ μαύρος ουρανός προς Πεντέλη" }
  - { id: m11, time: "18:06", channel: "112_sms", text: "We are tourists at a hotel near the beach in Mati, smoke everywhere, can't see the road. 6 people. Where do we go?" }
