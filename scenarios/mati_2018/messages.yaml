  - { id: m13, time: "18:09", channel: "100_call", text: "Είμαι στο αυτοκίνητο στη Μαραθώνος, ύψος Μάτι, έχει μποτιλιάρισμα, δεν κουνιέται τίποτα, ο καπνός πλησιάζει." }
