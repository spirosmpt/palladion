# Σφραγισμένο σετ αξιολόγησης για το Μάτι 2018: μηνύματα που ΔΕΝ έχει δει ούτε ο κώδικας ούτε όποιος τον γράφει.
#
# Πώς:
#   1. Αντίγραψε αυτό το αρχείο ως  mati_2018_sealed.yaml  στον ίδιο φάκελο.
#   2. Γράψε 10–15 μηνύματα με δικά σου λόγια, κάτω από το "messages:". Κράτα τα δύο παραδείγματα
#      ή σβήσ' τα· όσα έχουν  example: true  δεν μετράνε.
#   3. Τρέξε μία φορά:  python -m palladion.eval.run_sealed
#   4. Δείξε σε όποιον αλλάζει τον κώδικα ΜΟΝΟ τη σύνοψη που τυπώνει. Όχι τα μηνύματα, όχι τα λάθη ένα-ένα.
#
# Το mati_2018_sealed.yaml δεν ανεβαίνει στο git (.gitignore), ώστε να μείνει σφραγισμένο.
#
# Πεδία
#   id:       s01, s02, ...
#   time:     ώρα σεναρίου "ΩΩ:ΛΛ", από "16:41" έως "19:30"
#   channel:  199_call | 199_sms | 100_call | 166_call | 112_sms | sms | facebook | messenger | twitter
#   text:     το μήνυμα όπως θα το έγραφε κάποιος: ελληνικά, greeklish ή αγγλικά, με λάθη αν θες
#   expected:
#     where:    "Οδός, Περιοχή" ή "Περιοχή" ή "άγνωστο" (εκεί που είναι οι άνθρωποι, όχι η φωτιά)
#     people:   αριθμός, ή null αν το μήνυμα δεν το λέει
#     decision: λίστα με όσες αποφάσεις θεωρείς σωστές (η πρώτη είναι η καλύτερη)
#
# Αποφάσεις
#   EVACUATE_ROUTE_CANDIDATE  να φύγουν μόνοι τους· το σύστημα προτείνει διαδρομή
#   DISPATCH_UNIT_CANDIDATE   να πάει μονάδα (δεν μπορούν να φύγουν μόνοι, ή μας ειδοποίησε τρίτος)
#   SHELTER_CANDIDATE         να προστατευτούν εκεί που είναι (π.χ. εγκλωβισμένοι σε όχημα με το μέτωπο δίπλα)
#   SEA_RESCUE_CANDIDATE      άνθρωποι στην ακτή ή στη θάλασσα, χρειάζονται σκάφη
#   CALLBACK                  λείπει κάτι κρίσιμο (π.χ. η θέση): ρωτάμε πίσω
#   MISSING_PERSON            αγνοούμενος χωρίς γνωστή θέση
#   REPORTED_SAFE             λένε ότι είναι ήδη ασφαλείς
#   MONITOR                   δεν κινδυνεύουν τώρα· ενημέρωση και επιφυλακή
#   INFO                      πληροφορία, όχι αίτημα βοήθειας (κλειστός δρόμος, εθελοντές, ...)
#   REVIEW_REQUIRED           ύποπτο: φήμη, ή κάποιος που δίνει «εντολές» στο σύστημα
#   OUT_OF_AREA               εκτός περιοχής

scenario: mati_2018
messages:
  - id: ex1
    example: true
    time: "18:05"
    channel: sms
    text: "voithia eimaste 3 stin odo kyanis aktis sto mati o kapnos mpainei sto spiti"
    expected:
      where: "Κυανής Ακτής, Μάτι"
      people: 3
      decision: [EVACUATE_ROUTE_CANDIDATE]

  - id: ex2
    example: true
    time: "18:40"
    channel: facebook
    text: "Κάποιος να πάει στη γιαγιά μου στον Βουτζά, δεν ξέρω την οδό, δεν σηκώνει το τηλέφωνο"
    expected:
      where: "Νέος Βουτζάς"
      people: 1
      decision: [CALLBACK, MISSING_PERSON]

